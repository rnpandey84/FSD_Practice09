<!DOCTYPE html>
<html>
  <head>
    <style>
      
      .container{
        display:grid;
        grid-template-columns:repeat(3,120px);
        gap:15px;
        border:2px solid black;
        padding: 20px;
      }

    
      .box{
        width: 120px;
        height: 80px;
        background: seagreen;
        color: white;
        text-align: center;
        line-height: 80px;
        font-size: 20px;

      }
    </style>
  </head>

  <body>

    <h2>Grid layout</h2>

    <div class="container">

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
    <div class="box">Box 5</div>
    <div class="box">Box 6</div>

    </div>
    
  </body>
</html>
